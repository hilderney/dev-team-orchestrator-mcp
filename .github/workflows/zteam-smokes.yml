name: zteam-smokes

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "templates/**"
      - "package.json"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "templates/**"
      - "package.json"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:all
        env:
          NINEROUTER_KEY: smoke-ci-dummy
          NINEROUTER_BASE: http://127.0.0.1:9
